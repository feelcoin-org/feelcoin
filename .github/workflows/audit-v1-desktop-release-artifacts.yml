name: Audit v1.0.0 Desktop source-to-asset provenance

on:
  push:
    branches:
      - audit/provenance-v1-desktop-artifacts-20261027

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve original October 24 Linux QA artifact
        uses: actions/download-artifact@v4
        with:
          name: feelcoin-desktop-v1.0.0-linux-x64-QA
          repository: feelcoin-org/feelcoin
          run-id: 40092195491
          github-token: ${{ github.token }}
          path: original-linux
      - name: Retrieve original October 24 Windows QA artifact
        uses: actions/download-artifact@v4
        with:
          name: feelcoin-desktop-v1.0.0-windows-x64-QA
          repository: feelcoin-org/feelcoin
          run-id: 40083129764
          github-token: ${{ github.token }}
          path: original-windows
      - name: Compare original QA bundles to public installers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ORIGINAL QA FILES ==='
          find original-linux original-windows -maxdepth 2 -type f -printf '%p %s bytes\n'
          curl -fL --retry 2 --max-time 300 \
            -o /tmp/public-ubuntu22.deb \
            https://github.com/feelcoin-org/feelcoin-desktop/releases/download/v1.0.0/Feelcoin-v1.0.0-Ubuntu-22.04-x64.deb
          echo 'a9c81a94abba83dad75ac8ee1580b6e5b1a959c668ff691456cd6096931f4e88  /tmp/public-ubuntu22.deb' | sha256sum -c
          mkdir -p /tmp/original-deb /tmp/public-deb
          orig_deb="$(find original-linux -maxdepth 1 -name '*.deb' -print -quit)"
          dpkg-deb -x "$orig_deb" /tmp/original-deb
          dpkg-deb -x /tmp/public-ubuntu22.deb /tmp/public-deb
          python3 - <<'PY'
          import hashlib,pathlib
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          windows=list(pathlib.Path('original-windows').glob('*.exe'))
          app=list(pathlib.Path('original-linux').glob('*.AppImage'))
          old_deb=list(pathlib.Path('original-linux').glob('*.deb'))
          assert len(windows)==len(app)==len(old_deb)==1
          windows_hash=sha(windows[0])
          app_hash=sha(app[0])
          old_deb_hash=sha(old_deb[0])
          published = {
            'windows': '3adcd643f4c11c6035624ac3f94ee2b9e45130d74a7a108b29df55080213cc4b',
            'ubuntu22_app': '6cb4641b5a0b0a7490daaebac6122186284b938cababefe37879aa67963a5d0c',
            'ubuntu22_deb': 'a9c81a94abba83dad75ac8ee1580b6e5b1a959c668ff691456cd6096931f4e88',
          }
          assert windows_hash==published['windows'], 'Windows published asset does not match original QA artifact'
          print('PASS_EXACT_WINDOWS_QA_ASSET',windows_hash)
          assert app_hash==published['ubuntu22_app'], 'Ubuntu22 AppImage differs from original QA artifact'
          print('PASS_EXACT_UBUNTU22_APPIMAGE_QA_ASSET',app_hash)
          print('ORIGINAL_QA_DEB_SHA256',old_deb_hash)
          print('PUBLIC_UBUNTU22_DEB_SHA256',published['ubuntu22_deb'])
          if old_deb_hash != published['ubuntu22_deb']:
              print('NOTICE_ORIGINAL_QA_DEB_DIFFERS_FROM_PUBLIC_DEB (not inherently a daemon protocol issue)')
          for folder in ('/tmp/original-deb','/tmp/public-deb'):
              files=list(pathlib.Path(folder).rglob('feelcoind'))
              assert len(files)==1, f'{folder}: expected exactly one daemon'
              print('PACKAGED_DAEMON_SHA256',folder,sha(files[0]))
          PY
