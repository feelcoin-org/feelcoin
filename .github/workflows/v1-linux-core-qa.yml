name: Feelcoin Core v1.0.0 Linux QA - bounded validation
# Only a Core QA package, not a release or fork activation.
# Fix for earlier 150-minute ctest timeout: package checksum-verified Linux Core before the long test gate.
on:
  push:
    branches: [feature/v17-consensus-audit]
    paths: ['.github/workflows/v1-linux-core-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-core:
    name: Compile pinned Linux Core + bounded difficulty tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b1a1f08f82fb1ce33343ee512f852872553f824
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned consensus source (not branch head)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6b1a1f08f82fb1ce33343ee512f852872553f824
          grep -Fq '{ 17, 21205, 0,' src/hardforks/hardforks.cpp
          grep -Fq 'DEF_FEELCOIN_VERSION "1.0.0"' src/version.cpp.in
      - name: Install native Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake git pkg-config libboost-all-dev \
            libunbound-dev libunwind-dev libssl-dev libzmq3-dev \
            libsodium-dev libprotobuf-dev protobuf-compiler \
            libreadline-dev libhidapi-dev libusb-1.0-0-dev libicu-dev
      - name: Compile pinned Core CLI RPC and unit test binary
        run: |
          set -euo pipefail
          cmake -S . -B build/release -D ARCH=default -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TESTS=ON -D BUILD_DOCUMENTATION=OFF \
            -D USE_DEVICE_TREZOR=OFF -D USE_DEVICE_TREZOR_LIBUSB=OFF
          cmake --build build/release --parallel 2 \
            --target daemon simplewallet wallet_rpc_server unit_tests
      - name: Run bounded consensus difficulty unit smoke
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test -d build/release
          unit_test_bin="$(find build/release -type f -name unit_tests -perm /111 -print -quit)"
          if [ -z "$unit_test_bin" ]; then
            echo 'ERROR: Compiled unit_tests executable not found'
            find build/release -name unit_tests -print
            exit 1
          fi
          echo "Running difficulty tests from $unit_test_bin"
          timeout --signal=TERM --kill-after=10s 420s \
            "$unit_test_bin" --gtest_filter='difficulty.*'
      - name: Stage isolated Linux Core QA package and verify runtime
        run: |
          set -euo pipefail
          mkdir -p linux-stage
          for exe in feelcoind feelcoin-wallet-cli feelcoin-wallet-rpc; do
            test -s "build/release/bin/$exe"
            cp "build/release/bin/$exe" linux-stage/
            chmod +x "linux-stage/$exe"
            test "$(od -An -tx1 -N4 "linux-stage/$exe" | tr -d ' \n')" = 7f454c46
            "linux-stage/$exe" --version | tee "$exe-version.txt"
            grep -Fq 'v1.0.0-6b1a1f08f' "$exe-version.txt"
            ldd "linux-stage/$exe" | tee "$exe-ldd.txt"
            if grep -q 'not found' "$exe-ldd.txt"; then
              echo "ERROR: Missing dynamic runtime dependency in $exe"
              exit 1
            fi
          done
          echo "Feelcoin Core v1.0.0; source commit 6b1a1f08f; v17 height 21205; QA only. Full suite and consensus audit still pending." > linux-stage/README-CANDIDATE.txt
          (cd linux-stage && sha256sum feelcoind feelcoin-wallet-cli feelcoin-wallet-rpc > SHA256SUMS.txt)
          tar -czf feelcoin-core-v1.0.0-linux-x64-CANDIDATE.tar.gz -C linux-stage .
          sha256sum feelcoin-core-v1.0.0-linux-x64-CANDIDATE.tar.gz > feelcoin-core-v1.0.0-linux-x64-CANDIDATE.tar.gz.sha256
          (sha256sum -c feelcoin-core-v1.0.0-linux-x64-CANDIDATE.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: feelcoin-core-v1.0.0-linux-x64-candidate
          path: |
            feelcoin-core-v1.0.0-linux-x64-CANDIDATE.tar.gz
            feelcoin-core-v1.0.0-linux-x64-CANDIDATE.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Bounded full-suite observation (must pass for release approval)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "Long-running comprehensive suite previously exceeded 150 minutes."
          echo "This gate caps the test to identify hung cases without blocking artifact packaging."
          timeout --signal=TERM --kill-after=10s 840s \
            ctest --test-dir build/release -R '^unit_tests$' --output-on-failure
